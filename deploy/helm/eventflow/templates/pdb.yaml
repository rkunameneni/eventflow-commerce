{{- if .Values.defaults.podDisruptionBudget.enabled }}
{{- range $name, $svc := .Values.services }}
{{- $ctx := dict "root" $ "name" $name }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    {{- include "eventflow.labels" $ctx | nindent 4 }}
spec:
  maxUnavailable: {{ $.Values.defaults.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "eventflow.selectorLabels" $ctx | nindent 6 }}
---
{{- end }}
{{- end }}

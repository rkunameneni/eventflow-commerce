# Used by the standalone sonar-scanner. The Maven build (./mvnw sonar:sonar) derives the same
# settings from the POMs; the organisation and host are set in the parent pom.
sonar.projectKey=rkunameneni_eventflow-commerce
sonar.organization=rkunameneni
sonar.projectName=EventFlow Commerce
sonar.host.url=https://sonarcloud.io

sonar.sourceEncoding=UTF-8
sonar.java.source=21

sonar.modules=common-events,service-support,order-service,inventory-service,payment-service,notification-service,api-gateway
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.junit.reportPaths=target/surefire-reports,target/failsafe-reports

# Records and configuration classes carry no logic worth covering.
sonar.coverage.exclusions=**/*Application.java,**/config/**,**/*Properties.java

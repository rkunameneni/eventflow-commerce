server:
  port: 8084
  shutdown: graceful

spring:
  application:
    name: notification-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/notifications}
    username: ${DB_USERNAME:eventflow}
    password: ${DB_PASSWORD:eventflow}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration/notification
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
    producer:
      acks: all
      properties:
        enable.idempotence: true
    listener:
      observation-enabled: true
    template:
      observation-enabled: true
  data:
    web:
      pageable:
        max-page-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

eventflow:
  api:
    description: Customer notifications for order outcomes.
  security:
    jwt-secret: ${JWT_SECRET:local-development-signing-key-change-me}
  dlq:
    base-path: /api/v1/admin/notifications/dlq

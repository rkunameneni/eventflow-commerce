server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: inventory-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inventory}
    username: ${DB_USERNAME:eventflow}
    password: ${DB_PASSWORD:eventflow}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration/inventory
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      ssl:
        enabled: ${REDIS_SSL:false}
    web:
      pageable:
        max-page-size: 100
  cache:
    type: redis
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
    producer:
      acks: all
      properties:
        enable.idempotence: true
    listener:
      observation-enabled: true
    template:
      observation-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

eventflow:
  api:
    description: Product catalogue and stock reservations.
  security:
    jwt-secret: ${JWT_SECRET:local-development-signing-key-change-me}
    public-get-paths:
      - /api/v1/products
      - /api/v1/products/*
  dlq:
    base-path: /api/v1/admin/inventory/dlq
  cache:
    products-ttl: 10m
    availability-ttl: 30s

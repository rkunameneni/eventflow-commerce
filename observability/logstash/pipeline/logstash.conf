# Services ship one JSON document per log event over TCP (logstash-logback-encoder,
# Spring profile "logstash"). Fields: @timestamp, level, logger_name, message, service,
# traceId, spanId, correlationId, stack_trace.

input {
  tcp {
    port  => 5000
    codec => json_lines
  }
}

filter {
  # A consistent, lower-case field for dashboards and alerts.
  mutate {
    lowercase => ["level"]
    rename    => { "logger_name" => "logger" }
  }

  # Tag saga-related events so they can be filtered in one click.
  if [logger] =~ /Saga|ReservationService|PaymentService|NotificationService|OutboxRelay/ {
    mutate { add_tag => ["saga"] }
  }

  if [stack_trace] {
    mutate { add_tag => ["exception"] }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "eventflow-%{[service]}-%{+YYYY.MM.dd}"
  }
}

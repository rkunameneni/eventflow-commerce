groups:
  - name: eventflow
    rules:
      - alert: OutboxRelayFailing
        expr: increase(eventflow_outbox_relay_failures_total[5m]) > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.application }} cannot publish outbox events to Kafka"

      - alert: PaymentProviderCircuitOpen
        expr: resilience4j_circuitbreaker_state{name="payment-provider", state="open"} == 1
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "Payment provider circuit breaker is open; payments are being dead-lettered"

      - alert: HighServerErrorRate
        expr: |
          sum by (application) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            / sum by (application) (rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.application }} returns more than 5% server errors"

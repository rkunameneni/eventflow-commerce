global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: eventflow
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - api-gateway:8080
          - order-service:8081
          - inventory-service:8082
          - payment-service:8083
          - notification-service:8084
